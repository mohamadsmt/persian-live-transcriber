<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ترنسکریپت زنده فارسی</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="ترنسکریپت زنده">
        <header class="topbar">
          <div>
            <h1>ترنسکریپت زنده فارسی</h1>
            <p id="statusLine">در حال بررسی وضعیت سیستم...</p>
          </div>
          <div class="actions">
            <button id="refreshButton" type="button" class="ghost">به‌روزرسانی</button>
            <button id="startButton" type="button" class="primary">شروع</button>
            <button id="stopButton" type="button" class="danger" disabled>توقف</button>
          </div>
        </header>

        <section class="control-grid" aria-label="تنظیمات">
          <label>
            منبع صدا
            <select id="sourceSelect">
              <option value="mic">میکروفون</option>
              <option value="system">صدای سیستم</option>
              <option value="both">میکروفون + صدای سیستم</option>
            </select>
          </label>
          <label>
            میکروفون
            <select id="micDevice"></select>
          </label>
          <label>
            ورودی صدای سیستم
            <select id="systemDevice"></select>
          </label>
          <label class="toggle">
            <input id="cleanupToggle" type="checkbox" checked />
            <span>پاک‌سازی متن با Ollama</span>
          </label>
          <label>
            فایل صوتی
            <input id="audioFile" type="file" accept="audio/*,.aac,.flac,.m4a,.mp3,.mp4,.ogg,.wav" />
          </label>
          <label class="file-action">
            پردازش فایل
            <button id="transcribeFileButton" type="button">ترنسکریپت فایل</button>
          </label>
        </section>

        <section class="panels">
          <article class="panel">
            <div class="panel-head">
              <h2>متن خام Whisper</h2>
              <button type="button" data-copy="rawOutput">کپی</button>
            </div>
            <div
              id="rawOutput"
              class="transcript"
              aria-live="polite"
              data-empty="هنوز متنی ثبت نشده است."
            ></div>
          </article>
          <article class="panel">
            <div class="panel-head">
              <h2>نسخه پاک‌سازی‌شده</h2>
              <button type="button" data-copy="cleanOutput">کپی</button>
            </div>
            <div
              id="cleanOutput"
              class="transcript clean"
              aria-live="polite"
              data-empty="هنوز متنی ثبت نشده است."
            ></div>
          </article>
        </section>

        <section id="sessionOutput" class="session-output" aria-label="خروجی سشن" hidden>
          <div class="session-head">
            <h2>خروجی سشن</h2>
            <div class="session-actions">
              <button type="button" data-session-copy="unified" disabled>کپی متن یکپارچه</button>
              <button type="button" data-session-download="unified" disabled>دانلود متن TXT</button>
            </div>
          </div>
          <div class="session-grid">
            <section class="session-block" aria-label="متن یکپارچه">
              <div class="session-block-head">
                <h3>متن یکپارچه</h3>
              </div>
              <div
                id="unifiedOutput"
                class="transcript session-text"
                data-empty="بعد از توقف ضبط، متن یکپارچه اینجا نمایش داده می‌شود."
              ></div>
            </section>
            <section class="session-block" aria-label="خلاصه سشن">
              <div class="session-block-head">
                <h3>خلاصه سشن</h3>
                <div class="session-actions">
                  <button id="summarizeButton" type="button" disabled>ساخت خلاصه مفصل</button>
                  <button type="button" data-session-copy="summary" disabled>کپی خلاصه</button>
                  <button type="button" data-session-download="summary" disabled>دانلود خلاصه TXT</button>
                </div>
              </div>
              <div
                id="summaryOutput"
                class="transcript session-text"
                aria-live="polite"
                data-empty="خلاصه فقط بعد از درخواست شما ساخته می‌شود."
              ></div>
            </section>
          </div>
        </section>

        <footer class="exportbar">
          <button type="button" data-export="txt">خروجی TXT</button>
          <button type="button" data-export="json">خروجی JSON</button>
          <button type="button" data-export="srt">خروجی SRT</button>
          <span id="runtimeNote">مدل پیش‌فرض: Whisper large-v3، زبان: fa</span>
        </footer>
      </section>
    </main>
    <script src="/static/app.js?v=20260509-system-audio-devices" type="module"></script>
  </body>
</html>
